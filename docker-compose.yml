version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dipbuy
      POSTGRES_PASSWORD: dipbuy
      POSTGRES_DB: dipbuy
    ports:
      - "5432:5432"
    volumes:
      - dipbuy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipbuy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dipbuy:dipbuy@postgres:5432/dipbuy
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dipbuy:dipbuy@postgres:5432/dipbuy
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: node dist/worker/monitor.js

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dipbuy_pgdata:
