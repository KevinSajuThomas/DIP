databases:
  - name: dipbuy-db
    plan: free
    databaseName: dipbuy
    user: dipbuy

services:
  # Runs the API server AND the monitoring worker loop in one process, so
  # the whole backend fits in Render's free Web Service tier (Background
  # Workers require a paid plan). See src/serverWithWorker.ts.
  - type: web
    name: dipbuy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss --skip-generate && node dist/serverWithWorker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dipbuy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: SIMULATION_MODE
        value: "false"
      - key: PORT
        value: "4000"
      - key: MARKET_DATA_API_KEY
        value: "db7f7d735c1941d5932319a792e41391"
      - key: WHATSAPP_ACCESS_TOKEN
        value: ""
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: ""
      - key: WHATSAPP_RECIPIENT_NUMBER
        value: ""
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: POLLING_INTERVAL_SECONDS
        value: "60"
      - key: ALLOWED_ORIGIN
        value: https://dipbuy-frontend-c6f9.onrender.com

  - type: web
    name: dipbuy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dipbuy-backend-c6f9.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
